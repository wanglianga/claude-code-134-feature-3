server:
  port: 8080

spring:
  application:
    name: training-crm
  datasource:
    url: jdbc:h2:mem:trainingdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  commission-rate: 0.05          # 顾问提成比例
  complaint-compensation: 200    # 每条未结投诉在退费时的赔付金额
  absent-consumes-lesson: true   # 缺席是否照常扣课时
  installment-fee-rate: 0.02     # 分期手续费率（分期数>1时按期本金计收；报名满14天后退费，已承担手续费不退）
  refund-cooling-days: 14        # 退费冷静期天数：期内申请免收分期手续费（场景：家长报名两周后申请退费）

logging:
  level:
    root: info
